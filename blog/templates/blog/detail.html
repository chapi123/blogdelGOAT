{% extends "blog/layout.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block blog %}
<section class="blog-shell blog-detail-section">
    <article class="blog-detail-card">
        <div class="blog-detail-header">
            <span class="blog-tag">ARTÍCULO</span>
            <time>{{ post.created_at|date:"d/m/Y" }}</time>
        </div>

        <h1>{{ post.title }}</h1>

        <div class="blog-detail-content">
            {{ post.content|linebreaks }}
        </div>

        <div class="blog-detail-footer">
            <p>Última actualización: {{ post.updated_at|date:"d/m/Y" }}</p>
            <a href="{% url 'blog:index' %}" class="blog-link">
                Volver al blog
                <span>→</span>
            </a>
        </div>
    </article>
</section>
{% endblock %}
